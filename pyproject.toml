[project]
name = "rss-publisher-mcp"
version = "0.1.0"
description = "Deterministic RSS publishing engine with MCP, HTTP asset ingestion, lifecycle management, and optional semantic matching."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "bigbatmanorg" }]
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "nh3>=0.3,<1",
  "pillow>=12,<13",
  "pydantic>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
]

[project.scripts]
rss-publisher = "rss_publisher.cli:main"
rss-publisher-mcp = "rss_publisher.mcp_server:main"
rss-publisher-api = "rss_publisher.api:main"

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["rss_publisher"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
